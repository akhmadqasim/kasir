# nginx reverse proxy untuk POS Toko Sembako
#
# Aplikasi Tauri di PC kasir menjalankan HTTP server di 127.0.0.1:17720.
# nginx meneruskan trafik dari perangkat lain di LAN toko ke server itu.
#
# Pasang di:
#   Linux  : /etc/nginx/conf.d/kasir.conf
#   Windows: <nginx>/conf/conf.d/kasir.conf  (pastikan include conf.d/*.conf aktif)
#
# Jalankan aplikasi dengan KASIR_TRUST_PROXY=1 supaya server memakai
# X-Forwarded-For untuk rate limit dan X-Forwarded-Proto untuk flag cookie Secure.
# Tanpa variabel itu, header proxy diabaikan.

upstream kasir_app {
    server 127.0.0.1:17720;
    keepalive 16;
}

# Rate limit lapis pertama untuk endpoint login.
limit_req_zone $binary_remote_addr zone=kasir_login:10m rate=10r/m;

server {
    listen 80;
    server_name kasir.lokal;

    # Restore database diunggah lewat endpoint ini, jadi batas body harus longgar.
    client_max_body_size 512m;
    client_body_timeout 300s;

    # Laporan besar dan unduhan backup butuh waktu lebih dari default 60 detik.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    access_log /var/log/nginx/kasir.access.log;
    error_log  /var/log/nginx/kasir.error.log;

    location /api/auth/login {
        limit_req zone=kasir_login burst=5 nodelay;
        proxy_pass http://kasir_app;
        include /etc/nginx/conf.d/kasir_proxy_headers.inc;
    }

    location / {
        proxy_pass http://kasir_app;
        include /etc/nginx/conf.d/kasir_proxy_headers.inc;
    }
}

# --- HTTPS ---
# LAN toko boleh jalan tanpa TLS, tetapi trafiknya plaintext: PIN kasir dan
# cookie sesi bisa dibaca siapa pun di jaringan yang sama. Kalau jaringan
# toko dipakai bersama pelanggan (misalnya wifi tamu), aktifkan TLS.
