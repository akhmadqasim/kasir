[package]
name = "kasir"
version = "1.1.0"
description = "POS Toko Sembako"
authors = ["you"]
edition = "2021"

[lib]
name = "kasir_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `image-png`: the frontend posts the store logo as a PNG for the window icon.
tauri = { version = "2", features = ["image-png"] }
# Self-update from GitHub Releases, driven from Rust (see `updater/`). The
# JS-side `tauri-plugin-process` is not needed: `Update::install` exits the app
# itself and the NSIS installer relaunches it.
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sea-orm = { version = "1", features = ["sqlx-sqlite", "runtime-tokio-native-tls", "macros"] }
tokio = { version = "1", features = ["full"] }
bcrypt = "0.16"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
dirs = "6"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
flate2 = "1.1"
rusqlite = { version = "0.32", features = ["bundled"] }
tauri-plugin-mcp-bridge = "0.10"
# Embedded HTTP server. `rand`/`sha2`/`hex` mint and hash session tokens,
# `cookie` builds the `Set-Cookie` attributes, `rust-embed` compiles `dist/`
# into the binary. All five were already in `Cargo.lock` as transitive
# dependencies, so none of them adds anything new to the build.
axum = { version = "0.8", features = ["multipart"] }
tower-http = { version = "0.6", features = ["compression-gzip"] }
rand = "0.9"
sha2 = "0.10"
hex = "0.4"
cookie = "0.18"
rust-embed = { version = "8", features = ["mime-guess"] }
tokio-util = { version = "0.7.18", features = ["io"] }
# Already in `Cargo.lock` through tauri; used to check that an uploaded SVG
# logo parses as XML before it is stored and served.
quick-xml = "0.38"

[dev-dependencies]
# `ServiceExt::oneshot`, which drives the router in tests without a listener.
tower = { version = "0.5", features = ["util"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Graphics_Printing", "Win32_Graphics_Gdi", "Win32_Foundation", "Win32_Security"] }
